# =============================================================
# 店铺管理系统 docker-compose.yml
# 部署方式：将本文件与 Dockerfile、项目源码放在同一目录
# （dPanel 推荐：放入面板 /dpanel/compose/shop-system/ 目录，
#   面板自动发现后点击部署即可）
# 环境变量：同目录 .env 文件提供 ${VAR} 替换值（凭证不进镜像）
# =============================================================

services:
  shop-system:
    build: .
    image: shop-system:latest
    container_name: shop-system
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=3000
      # ===== 平台凭证（飞书/豆包 aPaaS，必填）=====
      - FORCE_AUTHN_INNERAPI_DOMAIN=${FORCE_AUTHN_INNERAPI_DOMAIN:?请在 .env 中设置平台基础域名 FORCE_AUTHN_INNERAPI_DOMAIN}
      - FORCE_AUTHN_ACCESS_KEY=${FORCE_AUTHN_ACCESS_KEY:-}
      - FORCE_AUTHN_ACCESS_SECRET=${FORCE_AUTHN_ACCESS_SECRET:-}
      - FORCE_AUTHN_TOKEN=${FORCE_AUTHN_TOKEN:-}
      - MIAODA_AUTHN_CODE=${MIAODA_AUTHN_CODE:-}
      - MIAODA_DEV_INNER_DOMAIN_WITH_PREFIX=${MIAODA_DEV_INNER_DOMAIN_WITH_PREFIX:-}
      # ===== 日志 =====
      - LOG_DIR=/app/logs
      - LOG_REQUEST_BODY=${LOG_REQUEST_BODY:-true}
      - LOG_RESPONSE_BODY=${LOG_RESPONSE_BODY:-true}
    volumes:
      - ./logs:/app/logs